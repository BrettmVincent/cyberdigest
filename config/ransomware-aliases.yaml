# Ransomware group name normalisation.
# Every ransomware source spells groups differently (RansomLook "inc ransom", ransomware.live "incransom",
# Will Thomas's matrices "INC Ransom", ThreatLabz folders "INC"). Names are matched after lowercasing and
# removing everything except letters and digits. The MISP galaxy ransomware cluster supplies more aliases
# automatically; entries here take precedence. Add a line when two spellings of one group don't merge.
groups:
  - { name: Akira, aliases: [akira] }
  - { name: Qilin, aliases: [qilin, agenda] }
  - { name: BlackCat (ALPHV), aliases: [alphv, blackcat, noberus, alphvm] }
  - { name: LockBit, aliases: [lockbit, lockbit2, lockbit3, lockbit30, lockbit5, lockbitblack, lockbit50] }
  - { name: INC Ransom, aliases: [inc, incransom, inc ransom] }
  - { name: The Gentlemen, aliases: [thegentlemen, gentlemen] }
  - { name: RansomHub, aliases: [ransomhub] }
  - { name: Black Basta, aliases: [blackbasta] }
  - { name: BlackSuit, aliases: [blacksuit, royal] }
  - { name: Play, aliases: [play, playcrypt] }
  - { name: Cl0p, aliases: [clop, cl0p, ta505] }
  - { name: DragonForce, aliases: [dragonforce] }
  - { name: SafePay, aliases: [safepay] }
  - { name: Medusa, aliases: [medusa, medusablog] }
