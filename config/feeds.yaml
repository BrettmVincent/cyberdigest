# Deliberately NOT added (2026-11-23):
#   Ransomware.live rss.xml / cyberattacks.xml, RansomLook RSS, Ransom Feed: every item is a victim name, which
#     CyberDigest never publishes (and Ransomware.live's terms forbid republishing its raw data). Their activity is
#     already counted, without names, through the RansomLook API and the optional Ransomware.live PRO key.
#   BleepingComputer ransomware tag feed: /tag/ransomware/feed/ returns 404 (main feed above already covers it).
#   NCSC UK all-rss-feed.xml: superset of the reports + news feeds above, plus board-level guidance posts.
#   Proofpoint /us/rss.xml: corporate press feed; the Threat Insight feed above is the research stream.
#   CISA all.xml: superset of the CISA component feeds above (kept disabled).
#   Trend Micro Research (feeds.trendmicro.com/TrendMicroResearch): connection fails (re-checked 2026-11-23).
#   MyJoyOnline (Ghana) ransomware tag: last item July 2025. Red Canary: replaced by Zscaler ThreatLabz above.
#   Halcyon, Symantec/security.com, Emsisoft, Ridgeline Cyber: no working RSS (page-monitoring only).
#
# No working feed found on 2026-11-23 (would need scraping or a CISA/CCCS proxy):
#   Trend Micro Research (moved to trendaisecurity.com, no RSS), Symantec Threat Hunter,
#   NCC Group Research, Packet Storm (RSS decommissioned 2025), ENISA (RSS discontinued),
#   VMware/Broadcom advisories, SANS DFIR blog, Citrix, Atlassian, Apple, Mozilla, SonicWall.
#   Their advisories reach CISA Alerts and CCCS (both above), usually within a day.
