# CyberDigest feed list
# Built from the original 100-feed list plus the 2026-11-23 feed audit
# (corrected URLs, tiers, drops and additions).
#
# Fields
#   id            stable identifier (lowercase, no spaces) - never reuse an id
#   name          display name
#   url           RSS 2.0 / Atom / RDF feed URL
#   tier          A = authoritative advisory (CERT / PSIRT / government)
#                 B = primary research (IOCs, TTPs, root-cause analysis)
#                 C = news / aggregation (folded into story clusters)
#   group         intel | vuln | gov | psirt | news | blue
#   enabled       false keeps the entry documented but skips fetching
#   firehose      true for high-volume advisory streams: their items only reach
#                 the Priority view when KEV / EPSS / SSVC / PoC rules fire
#   include       regex - keep only items whose title matches (case-insensitive)
#   exclude       regex - drop items whose title matches (case-insensitive)
#   marketing     false disables the global marketing-title filter (default on for tier B/C)
#   lang          ISO language code when not English
#   headers       extra request headers (e.g. a different User-Agent) if a site needs it

