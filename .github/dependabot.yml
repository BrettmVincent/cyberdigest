version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5
    ignore:
      # svelte-check supports TypeScript ^5 || ^6 only; TypeScript 7 (native port) breaks `npm run typecheck`.
      # Remove this once svelte-check lists TypeScript 7 in its peer dependencies.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
